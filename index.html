<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orosz — RU → HU</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Languru palette */
      --bg: #fbf6ee; --surface: #ffffff; --surface-2: #fdf9f2; --ink: #2c2115; --sub: #7a6c59; --line: #ece0d0;
      --accent: #5b4be0; --accent-2: #4a3bc7; --accent-ink: #ffffff; --accent-soft: color-mix(in srgb, var(--accent) 14%, var(--surface));
      --sh-sm: 0 1px 2px rgba(44,33,21,.06), 0 1px 3px rgba(44,33,21,.05);
      --sh: 0 4px 14px rgba(44,33,21,.08); --sh-lg: 0 18px 50px rgba(44,33,21,.16);
      --font: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --brand-font: 'Gaegu', 'Comic Sans MS', cursive;
      /* aliases so existing rules keep working */
      --card: var(--surface); --muted: var(--sub); --accent-d: var(--accent-2); --shadow: var(--sh);
      --new: #8e2fd0; --learning: #2b6fe0; --known: #2f9e5f; --untouched: #b8b4a8;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #17130f; --surface: #221d17; --surface-2: #1b1712; --ink: #efe8dd; --sub: #a89d8c; --line: #35302a;
        --accent-soft: color-mix(in srgb, var(--accent) 24%, var(--surface));
        --sh-sm: 0 1px 2px rgba(0,0,0,.4), 0 1px 3px rgba(0,0,0,.3); --sh: 0 4px 14px rgba(0,0,0,.5); --sh-lg: 0 18px 50px rgba(0,0,0,.6);
        --untouched: #4a4740;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); overflow-x: hidden;
      font: 16px/1.5 var(--font); }
    .logo { font-family: var(--brand-font); font-weight: 800; }
    /* Stress mark: underline the stressed vowel instead of an ugly floating accent. */
    .str { text-decoration: underline; text-decoration-color: #f5a623; text-decoration-thickness: 2px;
      text-underline-offset: 3px; text-decoration-skip-ink: none; }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 28px 16px 70px; }
    .page-head { margin-bottom: 20px; }
    .page-head h1 { font-size: 32px; margin: 0 0 4px; }
    .page-head .sub { color: var(--sub); margin: 0; }
    h1 { font-size: 26px; margin: 4px 0 2px; font-weight: 800; }
    .sub { color: var(--sub); margin: 0 0 16px; }
    /* Segmented pill tabs — like Languru's Learn/Groups/Words switch */
    .subtabs { display: flex; gap: 6px; background: var(--surface-2); border: 1px solid var(--line);
      border-radius: 999px; padding: 4px; margin: 0 auto 22px; max-width: 560px; }
    .subtab { flex: 1; padding: 9px 12px; border-radius: 999px; font-weight: 700; font-size: 15px; color: var(--sub);
      background: transparent; border: none; cursor: pointer; font-family: var(--font); transition: background .12s, color .12s; }
    .subtab:hover { color: var(--ink); }
    .subtab.sel { background: var(--accent); color: var(--accent-ink); }
    /* Profile bar + picker ("login") */
    .prof-bar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
    .prof-btn { background: var(--surface-2); border: 1px solid var(--line); color: var(--ink); font: inherit; font-weight: 700;
      font-size: 13px; padding: 7px 12px; border-radius: 999px; cursor: pointer; }
    .prof-btn:hover { border-color: var(--accent); }
    .gate { max-width: 460px; margin: 0 auto; }
    .prof-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 6px; }
    .prof-card { display: flex; align-items: center; gap: 12px; text-align: left; background: var(--surface); border: 1px solid var(--line);
      border-radius: 16px; padding: 14px 16px; cursor: pointer; transition: border-color .12s, transform .12s; }
    .prof-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .prof-av { font-size: 24px; width: 46px; height: 46px; display: grid; place-items: center; background: var(--accent-soft); border-radius: 50%; flex: none; }
    .prof-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .prof-main b { font-size: 17px; } .prof-main small { color: var(--sub); font-size: 12px; }
    .prof-del { opacity: .4; font-size: 16px; padding: 4px; border-radius: 8px; } .prof-del:hover { opacity: 1; }
    .prof-input { width: 100%; border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 11px 14px; font: inherit; color: var(--ink); outline: none; }
    .prof-input:focus { border-color: var(--accent); }
    .btn { border: 0; background: var(--accent); color: #fff; font: inherit; font-weight: 700;
      border-radius: 12px; padding: 11px 16px; cursor: pointer; }
    .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
    .btn:disabled { opacity: .5; cursor: default; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
    .search { display: flex; align-items: center; gap: 8px; background: var(--card);
      border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; box-shadow: var(--shadow); }
    .search input { flex: 1; border: 0; background: transparent; font: inherit; color: var(--ink); outline: none; }
    .clear { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 16px; }
    .lvl-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 8px; }
    .lvl-chip { border: 1px solid var(--line); background: var(--card); border-radius: 12px;
      padding: 7px 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; min-width: 58px; }
    .lvl-chip.sel { border-color: var(--accent); background: var(--accent-soft); }
    .lvl-chip b { font-size: 14px; } .lvl-chip span { font-size: 11px; color: var(--muted); }
    .count { color: var(--muted); font-size: 13px; margin: 6px 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }
    .tile { position: relative; text-align: left; border: 1px solid var(--line); background: var(--card);
      border-radius: 14px; padding: 12px 14px; cursor: pointer; box-shadow: var(--shadow);
      transition: transform .08s ease, border-color .12s; border-left-width: 5px; }
    .tile:hover { transform: translateY(-2px); }
    .tile.known { border-left-color: var(--known); } .tile.learning { border-left-color: var(--learning); }
    .tile.new { border-left-color: var(--new); } .tile.untouched { border-left-color: var(--untouched); }
    .tile .ru { font-size: 18px; font-weight: 700; }
    .tile .hu { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .asp { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
    .asp-t { font-weight: 800; color: var(--accent-d); font-size: 10px; text-transform: uppercase; letter-spacing: .03em; }
    .scard .asp { font-size: 16px; margin-top: 6px; }
    .tile .lv { font-size: 10px; font-weight: 800; color: var(--accent-d); }
    .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); margin: 10px 0; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: middle; }
    .empty { text-align: center; color: var(--muted); padding: 40px 0; }
    .big { font-size: 46px; }
    /* Groups — like Languru's Groups tab */
    .group-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-top: 10px; }
    .group-card { display: flex; align-items: center; gap: 12px; text-align: left; background: var(--surface); border: 1px solid var(--line);
      border-radius: 16px; padding: 14px 16px; cursor: pointer; transition: transform .12s, box-shadow .12s, border-color .12s; }
    .group-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.18); border-color: var(--accent); }
    .gc-ic { font-size: 26px; width: 50px; height: 50px; display: grid; place-items: center; background: var(--accent-soft); border-radius: 13px; flex: none; }
    .gc-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .gc-title { font-weight: 800; font-size: 16px; }
    .gc-sub { color: var(--sub); font-size: 12px; }
    .mini-bar { height: 5px; background: var(--line); border-radius: 999px; overflow: hidden; margin-top: 4px; }
    .mini-bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .3s; }
    .sec-h { font-weight: 800; font-size: 20px; margin: 22px 0 8px; }
    .link { color: var(--accent-d); font-weight: 700; cursor: pointer; }
    /* Study */
    .study { max-width: 460px; margin: 0 auto; }
    .prog { display: flex; align-items: center; justify-content: space-between; color: var(--muted);
      font-size: 13px; margin-bottom: 10px; }
    .back-arrow { border: 0; background: var(--card); border: 1px solid var(--line); width: 30px; height: 30px;
      border-radius: 9px; cursor: pointer; font-size: 16px; color: var(--ink); }
    .chip { background: var(--accent-soft); color: var(--accent-d); border-radius: 999px; padding: 2px 10px; font-weight: 700; font-size: 12px; }
    .flip { perspective: 1200px; }
    .flip-in { position: relative; transition: transform .5s; transform-style: preserve-3d; }
    .flip.is-flipped .flip-in { transform: rotateY(180deg); }
    .face { backface-visibility: hidden; }
    .face.back { position: absolute; inset: 0; transform: rotateY(180deg); }
    .scard { border: 1px solid var(--line); background: var(--card); border-radius: 20px; padding: 26px 22px;
      box-shadow: var(--shadow); text-align: center; min-height: 180px; display: flex; flex-direction: column; justify-content: center; }
    .scard .word { font-size: 40px; font-weight: 800; }
    .scard .pos { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .scard .mean { font-size: 24px; color: var(--accent-d); font-weight: 700; }
    .scard .ex { background: var(--accent-soft); border-radius: 12px; padding: 10px 12px; margin-top: 14px; font-size: 15px; }
    .scard .ex .exhu { color: var(--muted); font-size: 13px; margin-top: 3px; }
    .hint { color: var(--muted); font-style: italic; font-size: 13px; margin-top: 12px; }
    .decide { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 700; color: var(--muted); margin-top: 12px; }
    .decide .learn { color: var(--accent-d); }
    .q { font-weight: 700; margin-bottom: 12px; text-align: center; }
    .opts { display: grid; gap: 10px; }
    .opt { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 13px; font: inherit;
      cursor: pointer; text-align: center; }
    .opt:hover { border-color: var(--accent); }
    .opt.correct { border-color: var(--known); background: var(--accent-soft); }
    .opt.wrong { border-color: #e5393e; background: #fdecec; }
    .actions { display: flex; gap: 10px; margin-top: 16px; }
    .actions .btn { flex: 1; }
    /* Preview sheet */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center;
      justify-content: center; padding: 16px; z-index: 20; }
    .sheet { background: var(--card); border-radius: 20px; max-width: 420px; width: 100%; padding: 22px; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
    .sheet .word { font-size: 30px; font-weight: 800; }
    .sheet .mean { font-size: 20px; color: var(--accent-d); font-weight: 700; margin: 8px 0 12px; }
    .badge { display: inline-block; font-size: 11px; font-weight: 800; color: #fff; background: var(--accent);
      border-radius: 999px; padding: 1px 8px; vertical-align: middle; margin-left: 6px; }
    /* Swipe overlay */
    .swipe-ind { position: absolute; inset: 0; border-radius: 20px; opacity: 0; pointer-events: none;
      display: flex; flex-direction: column; gap: 6px; align-items: center; justify-content: center; overflow: hidden; }
    .swipe-ico { font-size: 74px; color: #fff; filter: drop-shadow(0 3px 10px rgba(0,0,0,.4)); }
    .swipe-cap { font-size: 18px; font-weight: 800; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.45); }
    .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: var(--accent);
      color: #fff; font-weight: 700; padding: 10px 16px; border-radius: 999px; box-shadow: 0 6px 20px rgba(0,0,0,.25); z-index: 30; }

    /* ===== Words page — matches Languru's Words page look & structure ===== */
    .search-box { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border: 1.5px solid var(--line);
      border-radius: 999px; padding: 4px 8px 4px 16px; margin: 0 auto 16px; max-width: 560px; transition: border-color .12s; }
    .search-box:focus-within { border-color: var(--accent); }
    .search-box .search-ic { opacity: .55; font-size: 15px; }
    .search-box input { flex: 1; border: none; background: transparent; outline: none; padding: 10px 4px; font-size: 16px; color: var(--ink); }
    .search-clear { border: none; background: var(--surface); color: var(--sub); width: 30px; height: 30px; border-radius: 50%;
      cursor: pointer; font-size: 14px; line-height: 1; flex: 0 0 auto; }
    .search-clear:hover { color: var(--ink); }

    .lvl-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 0 0 16px; }
    .lvl-chip { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 84px; padding: 8px 12px;
      border-radius: 14px; background: var(--surface-2); border: 2px solid var(--line); cursor: pointer; transition: border-color .12s; }
    .lvl-chip:hover { border-color: var(--accent); }
    .lvl-chip.sel { border-color: var(--accent); background: var(--accent-soft); }
    .lvl-chip b { font-size: 16px; } .lvl-chip span { font-size: 11px; color: var(--sub); }

    .wt-legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; margin-bottom: 12px; font-size: 12px; color: var(--sub); }
    .wt-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .wt-legend i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
    .wt-legend i.known { background: linear-gradient(135deg, #2f9e5f, #46b23f); }
    .wt-legend i.learning { background: linear-gradient(135deg, #2b6fe0, #24a3d4); }
    .wt-legend i.new { background: linear-gradient(135deg, #8e2fd0, #c21f8a); }
    .wt-legend i.untouched { background: linear-gradient(135deg, #767f8b, #9aa2ad); }

    .lvl-divider { display: flex; align-items: center; gap: 12px; margin: 20px 0 12px; }
    .lvl-divider::before, .lvl-divider::after { content: ''; flex: 1; height: 2px; background: var(--line); border-radius: 2px; }
    .lvl-divider span { font-weight: 800; font-size: 15px; letter-spacing: .06em; color: var(--sub); }

    .word-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(185px, 1fr)); gap: 12px; }
    @media (max-width: 380px) { .word-grid { grid-template-columns: repeat(2, 1fr); } }
    .word-tile { position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; min-height: 96px; padding: 16px 10px; border-radius: 14px; border: none; cursor: pointer; color: #fff;
      text-align: center; box-shadow: var(--sh-sm); transition: transform .1s, filter .12s; }
    .word-tile:hover { transform: translateY(-2px); filter: brightness(1.06); }
    .word-tile:active { transform: translateY(0); }
    .word-tile .wt-text { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .word-tile .wt-es { font-weight: 800; font-size: 17px; letter-spacing: .01em; }
    .word-tile .wt-pf { font-size: 11.5px; font-weight: 600; opacity: .92; }
    .word-tile .wt-pf b { font-size: 9px; text-transform: uppercase; letter-spacing: .04em; font-weight: 800; opacity: .85; }
    .word-tile .wt-hu { font-size: 12px; font-weight: 600; opacity: .9; }
    .word-tile.new { background: linear-gradient(135deg, #8e2fd0, #c21f8a); }
    .word-tile.learning { background: linear-gradient(135deg, #2b6fe0, #24a3d4); }
    .word-tile.known { background: linear-gradient(135deg, #2f9e5f, #46b23f); }
    .word-tile.untouched { background: linear-gradient(135deg, #767f8b, #9aa2ad); }

    /* Preview modal — matches Languru's peek card */
    .peek-overlay { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center;
      padding: 20px; background: rgba(0,0,0,.5); }
    .peek-card { width: 100%; max-width: 480px; max-height: 96vh; display: flex; flex-direction: column; overflow: hidden;
      background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 22px; text-align: center; box-shadow: var(--sh-lg); }
    .peek-card .flash-word { font-size: 38px; font-weight: 800; color: var(--ink); }
    .peek-card .peek-pf { font-size: 18px; color: var(--sub); margin-top: 2px; }
    .peek-card .peek-pf b { color: var(--accent-2); font-size: 11px; text-transform: uppercase; letter-spacing: .03em; }
    .peek-card .flash-hu { font-size: 24px; color: var(--accent-2); font-weight: 700; margin-top: 8px; }
    .peek-card .peek-pos { color: var(--sub); font-size: 13px; margin-top: 6px; }
    .vex { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; margin-top: 14px; text-align: left; font-size: 15px; }
    .vex span { display: block; color: var(--sub); font-size: 13px; margin-top: 4px; }
    .peek-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
    .peek-scroll { overflow-y: auto; min-height: 0; }
    .vdet { margin-top: 14px; text-align: left; border-top: 1px solid var(--line); padding-top: 6px; }
    .vdet h4 { margin: 12px 0 3px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent-2); }
    .vdet p { margin: 0; font-size: 14.5px; color: var(--ink); line-height: 1.45; }

    /* ===== Study (Tanulás) — matches Languru's vocab study UI ===== */
    .center-text { text-align: center; }
    .flash-progress { display: flex; align-items: center; justify-content: space-between; color: var(--sub); font-size: 14px; margin-bottom: 12px; }
    .vcard { border-radius: 22px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.16); background: var(--surface); border: 1px solid var(--line); }
    .vhero { position: relative; min-height: 240px; display: flex; align-items: center; justify-content: center; overflow: hidden; background: linear-gradient(135deg, #2b3346, #3a445c); }
    .vhero-ov { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,14,22,.30) 0%, rgba(10,14,22,.5) 55%, rgba(10,14,22,.82) 100%); }
    .vhero-top { position: absolute; top: 14px; right: 14px; z-index: 2; }
    .vhero-center { position: relative; z-index: 2; text-align: center; color: #fff; padding: 24px; width: 100%; }
    .vhero-word { font-size: 40px; font-weight: 900; letter-spacing: .01em; text-shadow: 0 2px 14px rgba(0,0,0,.55); word-break: break-word; }
    .vhero-pf { margin-top: 8px; font-size: 17px; font-weight: 700; opacity: .92; }
    .vhero-pf b { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; opacity: .8; }
    .vhero-pos { margin-top: 6px; font-size: 14px; font-style: italic; opacity: .85; }
    /* 🔊 speak buttons */
    .vspeak { margin-top: 12px; background: rgba(255,255,255,.2); border: none; color: #fff; width: 42px; height: 42px;
      border-radius: 50%; cursor: pointer; font-size: 18px; transition: background .12s; }
    .vspeak:hover { background: rgba(255,255,255,.34); }
    .speak-inline { border: none; background: var(--accent-soft); color: var(--accent-2); width: 34px; height: 34px;
      border-radius: 50%; cursor: pointer; font-size: 15px; vertical-align: middle; margin-left: 8px; }
    .speak-inline:hover { filter: brightness(1.08); }
    .vhero-prompt { font-size: 26px; font-weight: 800; line-height: 1.35; text-shadow: 0 2px 12px rgba(0,0,0,.55); }
    .vbadge { display: inline-block; padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: .06em; color: #fff; background: rgba(0,0,0,.4); }
    .vbadge.phase-new { background: linear-gradient(135deg, #8e2fd0, #c21f8a); }
    .vbadge.phase-learning { background: linear-gradient(135deg, #2b6fe0, #24a3d4); }
    .vbadge.phase-known { background: linear-gradient(135deg, #2f9e5f, #46b23f); }
    .vpanel { padding: 20px; }
    .flip-hint { font-style: italic; color: var(--sub); }
    .vdef { font-size: 24px; font-weight: 800; color: var(--accent); text-align: center; margin-bottom: 10px; }
    .mean-pf { text-align: center; margin: 0 0 10px; color: var(--sub); font-size: 16px; }
    .mean-pf b { color: var(--accent-2); font-size: 11px; text-transform: uppercase; letter-spacing: .03em; }
    .ex-q { font-size: 15px; color: var(--sub); font-weight: 600; margin-bottom: 10px; text-align: center; }
    .opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
    .opt-btn { font-family: var(--font); font-size: 16px; font-weight: 600; padding: 14px; border: 1.5px solid var(--line);
      border-radius: 10px; background: var(--surface-2); cursor: pointer; color: var(--ink); transition: border-color .12s, background .12s; }
    .opt-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
    .opt-btn:disabled { cursor: default; }
    .opt-btn.correct { border-color: #2f9e5f; background: color-mix(in srgb, #2f9e5f 18%, var(--surface)); font-weight: 800; }
    .opt-btn.wrong { border-color: #d1544e; background: color-mix(in srgb, #d1544e 16%, var(--surface)); }
    /* Robust flip: horizontal collapse → swap face → expand (no 3D backface = no mobile mirroring). */
    .flip3d-inner { position: relative; transition: transform .16s ease; transform-origin: center; }
    .flip3d-face { cursor: pointer; }
    .flip3d-back { display: none; }
    .flip3d.is-flipped .flip3d-front { display: none; }
    .flip3d.is-flipped .flip3d-back { display: block; }
    .study { max-width: 480px; margin: 0 auto; }

    .empty { text-align: center; padding: 60px 20px; color: var(--sub); }
    .empty .big { font-size: 56px; margin-bottom: 10px; }
    h1 { font-weight: 800; }
  </style>
</head>
<body>
  <div class="wrap" id="app"></div>

  <script src="data.js?v=10"></script>
  <!-- Cloud sync (cross-device profiles). Supabase publishable key — safe for public clients. -->
  <script>window.RU_SYNC = { url: 'https://xoitcnupxuzpnkdlryiz.supabase.co', key: 'sb_publishable_1Jb7uguywYbXkIiULUPpfg_OIpxNJKN' };</script>
  <script>
    // ---------- helpers ----------
    const LEVELS = ['A1', 'A2', 'B1', 'B2', 'C1', 'C2'];
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const strip = (s) => String(s).toLowerCase().replace(/́/g, '').replace(/ё/g, 'е').trim();
    // display headword: stressed form if we have it, else plain
    const disp = (w) => w.stress || w.ru;
    // Render a Russian word: the vowel before a combining acute (U+0301) gets an
    // underline via <span class="str">, and the accent char itself is dropped.
    const STRESS_RE = /([аеёиоуыэюяАЕЁИОУЫЭЮЯ])́/g;
    const stressHtml = (raw) => esc(raw).replace(STRESS_RE, '<span class="str">$1</span>');
    // Speak a Russian word out loud (browser TTS, ru-RU voice, no key needed).
    let RU_VOICE = null;
    function pickVoice() { try { RU_VOICE = (speechSynthesis.getVoices() || []).find((v) => /ru/i.test(v.lang)) || null; } catch {} }
    try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } catch {}
    function speak(text) {
      try {
        const clean = String(text).replace(/́/g, ''); // drop stress marks before speaking
        const u = new SpeechSynthesisUtterance(clean);
        u.lang = 'ru-RU'; u.rate = 0.9; if (RU_VOICE) u.voice = RU_VOICE;
        speechSynthesis.cancel(); speechSynthesis.speak(u);
      } catch {}
    }
    // One delegated listener handles every 🔊 button, across re-renders.
    document.addEventListener('click', (e) => { const b = e.target.closest('[data-speak]'); if (b) { e.stopPropagation(); speak(b.dataset.speak); } });
    const speakBtn = (ru, cls) => `<button class="${cls}" data-speak="${esc(ru)}" title="Kimondás" aria-label="Kimondás">🔊</button>`;
    // small "befejezett: <pf>" line for verb aspect pairs
    const pfLine = (w) => w.pf ? `<div class="asp"><span class="asp-t">bef.</span> ${stressHtml(w.pf)}</div>` : '';
    const shuffle = (a) => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

    const seen = new Set();
    const WORDS = (window.RU_WORDS || []).filter((w) => { const k = strip(w.ru); if (seen.has(k)) return false; seen.add(k); return true; });
    const BY_RU = Object.fromEntries(WORDS.map((w) => [w.ru, w]));
    const GROUPS = window.RU_GROUPS || [];

    // ---------- profiles + progress (localStorage) ----------
    // Each profile remembers its OWN learned words (prog) and level. No password.
    const DBKEY = 'ru_profiles_v1';
    let DB = { profiles: {}, active: null };
    try { DB = JSON.parse(localStorage.getItem(DBKEY) || 'null') || { profiles: {}, active: null }; } catch { DB = { profiles: {}, active: null }; }
    if (!DB.profiles) DB.profiles = {};
    function saveDB() { try { localStorage.setItem(DBKEY, JSON.stringify(DB)); } catch {} }
    // One-time migration: fold the old single-user data into a first profile.
    if (!Object.keys(DB.profiles).length) {
      let oldProg = null, oldLevel = null;
      try { oldProg = JSON.parse(localStorage.getItem('ru_progress_v1') || 'null'); } catch {}
      try { oldLevel = localStorage.getItem('ru_mylevel') || localStorage.getItem('ru_slevel'); } catch {}
      if (oldProg && Object.keys(oldProg).length) {
        const id = 'p' + Date.now();
        DB.profiles[id] = { name: 'Az én profilom', level: oldLevel || 'all', prog: oldProg };
        DB.active = id; saveDB();
      }
    }
    let PROF = null;   // active profile object
    let PROG = {};     // active profile's progress (by reference into DB)
    function saveProg() { touch(); saveDB(); syncPush(); }
    const statusOf = (ru) => (PROG[ru]?.status || 'untouched');
    function setWord(ru, patch) { PROG[ru] = { ...(PROG[ru] || { status: 'untouched', stages: [] }), ...patch }; saveProg(); }
    // Light PIN hash (obfuscation only — a shared store can't keep a 4-digit PIN truly secret).
    function hashPin(s) { let h = 5381; s = String(s); for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return 'h' + h.toString(36); }
    function touch() { if (PROF) { PROF.updatedAt = Date.now(); } }
    function useProfile(id) { if (!DB.profiles[id]) return; DB.active = id; PROF = DB.profiles[id]; if (!PROF.prog) PROF.prog = {}; PROG = PROF.prog; state.level = PROF.level || 'all'; state.gate = false; saveDB(); }
    function newProfile(name, level, pin) { const id = 'p' + Date.now(); DB.profiles[id] = { name: name || 'Profil', level: level || 'all', pin: pin ? hashPin(pin) : '', prog: {}, updatedAt: Date.now() }; saveDB(); syncPush(); return id; }

    // ---------- optional cloud sync (cross-device) ----------
    // Enable by defining window.RU_SYNC = { url: '<supabase-url>', key: '<anon-key>' } before this script.
    // Table `sync`(id text primary key, data jsonb). Merges profiles by updatedAt; no config = local only.
    const SYNC = (window.RU_SYNC && window.RU_SYNC.url && window.RU_SYNC.key) ? window.RU_SYNC : null;
    let syncTimer = null;
    const syncHeaders = () => ({ apikey: SYNC.key, Authorization: 'Bearer ' + SYNC.key, 'Content-Type': 'application/json' });
    function mergeProfiles(remote) {
      for (const [id, rp] of Object.entries(remote || {})) {
        const lp = DB.profiles[id];
        if (!lp || (rp.updatedAt || 0) > (lp.updatedAt || 0)) DB.profiles[id] = rp;
      }
    }
    async function syncPull() {
      if (!SYNC) return;
      try {
        const r = await fetch(SYNC.url + '/rest/v1/sync?id=eq.profiles&select=data', { headers: syncHeaders() });
        if (r.ok) {
          const rows = await r.json(); const remote = rows && rows[0] && rows[0].data && rows[0].data.profiles;
          if (remote) { mergeProfiles(remote); saveDB(); if (!PROF && DB.active && DB.profiles[DB.active]) useProfile(DB.active); render(); }
        }
      } catch {}
      syncPush(); // upload/converge local profiles to the cloud
    }
    function syncPush() {
      if (!SYNC) return;
      clearTimeout(syncTimer);
      syncTimer = setTimeout(() => {
        fetch(SYNC.url + '/rest/v1/sync?on_conflict=id', {
          method: 'POST', headers: { ...syncHeaders(), Prefer: 'resolution=merge-duplicates' },
          body: JSON.stringify({ id: 'profiles', data: { profiles: DB.profiles } }),
        }).catch(() => {});
      }, 800);
    }

    // ---------- state ----------
    const state = { tab: 'learn', wQuery: '', groupDetail: null,
      level: 'all',     // active profile's level ('all' or A1..C2)
      gate: false,      // true = show the profile picker
      newName: '', newLevel: 'all', newPin: '', // new-profile form
      pinFor: null, pinErr: false, // PIN dialog for a locked profile
      study: null };
    // Set my level for the active profile, remember it, refresh study + view.
    function setLevel(lv) { state.level = lv; if (PROF) { PROF.level = lv; touch(); saveDB(); syncPush(); } buildStudy(); }
    // Activate the saved profile, or show the picker.
    if (DB.active && DB.profiles[DB.active]) useProfile(DB.active); else state.gate = true;

    const $app = document.getElementById('app');
    // Page header + centered pill tabs (Tanulás / Csoportok / Szavak) — like Languru.
    const V_TITLE = '🇷🇺 Orosz szavak';
    const V_SUB = 'Kép nélkül is: hangsúly, folyamatos/befejezett igepár, példamondat és ismétlés.';
    function chromeTop() {
      const tb = (id, l) => `<button class="subtab ${state.tab === id ? 'sel' : ''}" data-tab="${id}">${l}</button>`;
      const prof = `<div class="prof-bar"><button class="prof-btn" data-gate="1" title="Profilváltás">👤 ${esc(PROF ? PROF.name : 'Profil')} · ${state.level === 'all' ? 'Mind' : esc(state.level)}</button></div>`;
      return `${prof}<div class="page-head"><h1>${V_TITLE}</h1><p class="sub">${V_SUB}</p></div>
        <div class="subtabs">${tb('learn', 'Tanulás')}${tb('groups', 'Csoportok')}${tb('words', 'Szavak')}</div>`;
    }
    function bindSubtabs() {
      const g = $app.querySelector('.prof-btn[data-gate]'); if (g) g.addEventListener('click', () => { state.gate = true; render(); });
      $app.querySelectorAll('.subtab[data-tab]').forEach((b) => b.addEventListener('click', () => {
        state.tab = b.dataset.tab; state.groupDetail = null;
        if (b.dataset.tab === 'learn' && !state.study) buildStudy(); else render();
      }));
    }

    // ---------- study engine ----------
    const EX = ['choose', 'reverse']; // both must pass -> known
    function pickStage(ru) {
      const p = PROG[ru];
      if (!p || p.status === 'untouched' || (p.status === 'new' && !(p.stages || []).includes('intro'))) return 'flashcard';
      const done = p.stages || [];
      const left = EX.filter((e) => !done.includes(e));
      return left.length ? left[Math.floor(Math.random() * left.length)] : 'choose';
    }
    function buildStudy(pool) {
      // pool: array of ru for a GROUP session (studies exactly those, any level);
      // otherwise a normal session drawn from the remembered level (state.level).
      const group = !!pool;
      let base;
      if (group) base = pool;
      else base = WORDS.filter((w) => state.level === 'all' || w.level === state.level)
        .sort((a, b) => LEVELS.indexOf(a.level) - LEVELS.indexOf(b.level)).map((w) => w.ru);
      const list = base.filter((ru) => BY_RU[ru] && statusOf(ru) !== 'known').slice(0, 12);
      // Dynamic queue: the front word is shown; unfinished words rotate to the back
      // and come round again (so each word gets its intro, then its 2 exercises).
      state.study = { queue: list, total: list.length, learned: 0, flipped: false, answered: null, group };
      render();
    }
    function studyDone() { return !state.study || state.study.queue.length === 0; }
    function curRu() { return state.study.queue[0]; }
    function options(word, key) {
      // key 'hu' for choose (RU->HU), 'ru' for reverse (HU->RU)
      const pool = shuffle(WORDS.filter((w) => w.ru !== word.ru)).slice(0, 3).map((w) => w[key]);
      return shuffle([word[key], ...pool]);
    }
    function reset(s) { s.flipped = false; s.answered = null; s._opts = null; s._optsFor = null; }
    function rotate() { const s = state.study; s.queue.push(s.queue.shift()); reset(s); render(); }
    function finishWord() { const s = state.study; s.queue.shift(); s.learned++; reset(s); render(); }

    function decide(learn) {
      const ru = curRu();
      if (learn) { setWord(ru, { status: 'new', stages: ['intro'] }); rotate(); }
      else { setWord(ru, { status: 'known', stages: ['intro', ...EX] }); toast('Már tudod ✓'); finishWord(); }
    }
    function answer(stage, choice, word) {
      const correct = stage === 'choose' ? choice === word.hu : choice === word.ru;
      state.study.answered = { choice, correct, stage };
      if (correct) {
        const p = PROG[word.ru] || { status: 'learning', stages: ['intro'] };
        const stages = Array.from(new Set([...(p.stages || ['intro']), stage]));
        const status = EX.every((e) => stages.includes(e)) ? 'known' : 'learning';
        setWord(word.ru, { status, stages });
        render();
        setTimeout(() => { if (status === 'known') { toast('Megtanultad! 🎉'); finishWord(); } else rotate(); }, 750);
      } else {
        render();
        setTimeout(() => rotate(), 1400);
      }
    }

    function toast(msg) {
      const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
      document.body.appendChild(t); setTimeout(() => t.remove(), 1600);
    }

    // ---------- renders ----------
    function counts(pool) { const c = { all: pool.length }; for (const lv of LEVELS) c[lv] = pool.filter((w) => w.level === lv).length; return c; }
    const statusClass = (ru) => statusOf(ru);

    function renderWords() {
      const c = counts(WORDS);
      const chip = (lv, label) => `<button class="lvl-chip ${state.level === lv ? 'sel' : ''}" data-lv="${lv}"><b>${label}</b><span>${learnedIn(lv)}/${c[lv] || 0} megtanult</span></button>`;
      const q = strip(state.wQuery);
      const searchBar = `<div class="search-box"><span class="search-ic">🔎</span>
        <input id="q" placeholder="Keresés (oroszul vagy magyarul)…" value="${esc(state.wQuery)}" autocomplete="off" autocapitalize="none" spellcheck="false">
        ${state.wQuery ? '<button class="search-clear" id="clear" aria-label="törlés">✕</button>' : ''}</div>`;
      let rows = WORDS.filter((w) => (state.level === 'all' || w.level === state.level) &&
        (!q || strip(w.ru).includes(q) || strip(w.hu).includes(q) || strip(disp(w)).includes(q) || (w.pf && strip(w.pf).includes(q))));
      // Grid: a specific level shows a plain grid; "Mind" or a search groups by level (labeled divider), like Languru.
      let grid;
      if (!rows.length) grid = `<div class="empty"><div class="big">🤔</div><p>Nincs találat.</p></div>`;
      else if (state.level !== 'all' && !q) grid = `<div class="word-grid">${rows.map(wordTile).join('')}</div>`;
      else {
        const groups = {}; for (const w of rows) (groups[w.level] || (groups[w.level] = [])).push(w);
        grid = LEVELS.filter((lv) => groups[lv]).map((lv) =>
          `<div class="lvl-divider"><span>${lv}</span></div><div class="word-grid">${groups[lv].map(wordTile).join('')}</div>`).join('');
      }
      $app.innerHTML = chromeTop() + `
        <p class="sub" style="text-align:center;margin:-8px 0 14px">A szótár szintenként — koppints egy szóra az előnézethez.</p>
        ${searchBar}
        <div class="lvl-row">${chip('all', 'Mind') + LEVELS.map((lv) => chip(lv, lv)).join('')}</div>
        ${legend()}
        <div class="count">${rows.length} szó</div>
        ${grid}`;
      bindSubtabs();
      $app.querySelectorAll('[data-lv]').forEach((b) => b.addEventListener('click', () => setLevel(b.dataset.lv)));
      $app.querySelectorAll('[data-ru]').forEach((b) => b.addEventListener('click', () => openWord(BY_RU[b.dataset.ru])));
      const qi = document.getElementById('q'); if (qi) { qi.addEventListener('input', (e) => { state.wQuery = e.target.value; render(); }); qi.focus(); qi.setSelectionRange(qi.value.length, qi.value.length); }
      const cl = document.getElementById('clear'); if (cl) cl.addEventListener('click', () => { state.wQuery = ''; render(); });
    }
    function legend() {
      const it = (c, l) => `<span><i class="${c}"></i>${l}</span>`;
      return `<div class="wt-legend">${it('known', 'megtanult')}${it('learning', 'tanulásban')}${it('new', 'új')}${it('untouched', 'nem kezdett')}</div>`;
    }
    // One word tile — solid colour by status, like Languru's Words page.
    function wordTile(w) {
      return `<button class="word-tile ${statusClass(w.ru)}" data-ru="${esc(w.ru)}" title="${esc(w.hu)}">
        <span class="wt-text"><span class="wt-es">${stressHtml(disp(w))}</span>${w.pf ? `<span class="wt-pf"><b>bef.</b> ${stressHtml(w.pf)}</span>` : ''}<span class="wt-hu">${esc(w.hu)}</span></span></button>`;
    }
    const learnedIn = (lv) => WORDS.filter((w) => (lv === 'all' || w.level === lv) && statusOf(w.ru) === 'known').length;

    // words of a group up to the chosen level (cumulative), like Languru's group level filter
    const grpWords = (g, gl) => gl === 'all' ? g.words : g.words.filter((ru) => BY_RU[ru] && LEVELS.indexOf(BY_RU[ru].level) <= LEVELS.indexOf(gl));
    function renderGroups() {
      if (state.groupDetail) return renderGroupDetail();
      const gl = state.level;
      const card = (g) => { const ws = grpWords(g, gl); const learned = ws.filter((ru) => statusOf(ru) === 'known').length;
        const pct = ws.length ? Math.round((learned / ws.length) * 100) : 0;
        return `<button class="group-card" data-g="${g.id}"><span class="gc-ic">${g.icon}</span>
          <span class="gc-main"><span class="gc-title">${esc(g.title)}</span><span class="gc-sub">${learned}/${ws.length} megtanult</span>
          <span class="mini-bar"><i style="width:${pct}%"></i></span></span></button>`; };
      const byCat = (cat, label) => { let list = GROUPS.filter((g) => g.cat === cat); if (gl !== 'all') list = list.filter((g) => grpWords(g, gl).length);
        if (!list.length) return ''; return `<div class="sec-h">${label}</div><div class="group-grid">${list.map(card).join('')}</div>`; };
      const lchip = (lv, l) => `<button class="lvl-chip ${gl === lv ? 'sel' : ''}" data-glv="${lv}"><b>${l}</b></button>`;
      $app.innerHTML = chromeTop() + `
        <p class="sub" style="text-align:center;margin:-8px 0 14px">Tanulj témák és nyelvtan szerint.</p>
        <div class="lvl-row">${lchip('all', 'Mind') + LEVELS.map((lv) => lchip(lv, lv)).join('')}</div>
        ${byCat('topic', 'Témák')}${byCat('grammar', 'Nyelvtan')}`;
      bindSubtabs();
      $app.querySelectorAll('[data-glv]').forEach((b) => b.addEventListener('click', () => setLevel(b.dataset.glv)));
      $app.querySelectorAll('[data-g]').forEach((b) => b.addEventListener('click', () => { state.groupDetail = b.dataset.g; render(); }));
    }
    function renderGroupDetail() {
      const g = GROUPS.find((x) => x.id === state.groupDetail);
      const tiles = g.words.map((ru) => { const w = BY_RU[ru]; return w ? wordTile(w) : ''; }).join('');
      $app.innerHTML = chromeTop() + `<div style="margin-bottom:10px"><span class="link" id="gback">← Csoportok</span></div>
        <div class="prog"><span style="font-size:22px">${g.icon}</span><b style="font-size:20px">${esc(g.title)}</b><button class="btn" id="gstudy">Tanuld a csoportot</button></div>
        ${legend()}<div class="word-grid">${tiles}</div>`;
      bindSubtabs();
      document.getElementById('gback').addEventListener('click', () => { state.groupDetail = null; render(); });
      document.getElementById('gstudy').addEventListener('click', () => { state.tab = 'learn'; buildStudy(g.words.filter((ru) => BY_RU[ru])); });
      $app.querySelectorAll('[data-ru]').forEach((b) => b.addEventListener('click', () => openWord(BY_RU[b.dataset.ru])));
    }

    function studyLevelBar() {
      const c = counts(WORDS);
      const label = state.level === 'all' ? 'Szintem: Mind' : `Szintem: ${state.level}`;
      const chip = (lv, l) => `<button class="lvl-chip ${state.level === lv ? 'sel' : ''}" data-slv="${lv}"><b>${l}</b><span>${c[lv] || 0}</span></button>`;
      return `<div class="count" style="margin-bottom:2px">${label}</div><div class="lvl-row" style="margin-top:0">${chip('all', 'Mind') + LEVELS.map((lv) => chip(lv, lv)).join('')}</div>`;
    }
    function bindStudyLevel() {
      $app.querySelectorAll('[data-slv]').forEach((b) => b.addEventListener('click', () => setLevel(b.dataset.slv)));
    }
    function renderLearn() {
      if (!state.study) { buildStudy(); return; }
      const bar = state.study.group ? '' : studyLevelBar();
      if (studyDone()) {
        const msg = state.study.total === 0
          ? (state.level === 'all' ? 'Minden szót megtanultál! 🎉' : `Ezen a szinten (${state.level}) minden szót tudsz. Válassz másik szintet.`)
          : 'Kész! Szép munka.';
        $app.innerHTML = chromeTop() + `<div class="study">${bar}<div class="empty"><div class="big">🎉</div><p>${msg}</p>
          <button class="btn" id="again" style="margin-top:14px">Új kör</button></div></div>`;
        bindSubtabs();
        document.getElementById('again').addEventListener('click', () => buildStudy());
        bindStudyLevel();
        return;
      }
      const s = state.study; const ru = curRu(); const w = BY_RU[ru];
      const stage = s.answered ? s.answered.stage : pickStage(ru); // keep the answered card visible
      const p = PROG[ru]; const done = (p?.stages || []).filter((x) => EX.includes(x)).length;
      const phase = statusOf(ru) === 'untouched' ? 'new' : statusOf(ru);
      const head = `${bar}<div class="flash-progress">
        <span>📚 ${s.learned} / ${s.total}</span>
        <span class="vbadge phase-${phase}">${stage === 'flashcard' ? 'ÚJ SZÓ' : done + '/2'}</span></div>`;
      let body = '';
      if (stage === 'flashcard') {
        body = `<div class="flip3d ${s.flipped ? 'is-flipped' : ''}" id="flip"><div class="flip3d-inner">
          <div class="vcard flip3d-face flip3d-front" data-flip>
            <div class="vhero"><div class="vhero-ov"></div><div class="vhero-top"><span class="vbadge phase-new">ÚJ SZÓ</span></div>
              <div class="vhero-center"><div class="vhero-word">${stressHtml(disp(w))}</div>${w.pf ? `<div class="vhero-pf"><b>bef.</b> ${stressHtml(w.pf)}</div>` : ''}${w.pos ? `<div class="vhero-pos">${esc(w.pos)}</div>` : ''}<div>${speakBtn(w.ru, 'vspeak')}</div></div></div>
            <div class="vpanel center-text"><div class="flip-hint">koppints a megfordításhoz</div></div></div>
          <div class="vcard flip3d-face flip3d-back" data-flip>
            <div class="vhero"><div class="vhero-ov"></div><div class="vhero-center"><div class="vhero-word">${stressHtml(disp(w))}</div><div>${speakBtn(w.ru, 'vspeak')}</div></div></div>
            <div class="vpanel"><div class="vdef">${esc(w.hu)}</div>${w.pf ? `<p class="mean-pf"><b>bef.</b> ${stressHtml(w.pf)}</p>` : ''}${w.ex ? `<div class="vex">„${esc(w.ex)}"<span>${esc(w.exHu || '')}</span></div>` : ''}
              <div class="actions"><button class="btn ghost" id="know">👍 Már tudom</button><button class="btn" id="learn">📚 Tanulom</button></div></div></div>
        </div></div>`;
      } else {
        const isChoose = stage === 'choose';
        const key = isChoose ? 'hu' : 'ru';
        if (!s._opts || s._optsFor !== ru + stage) { s._opts = options(w, key); s._optsFor = ru + stage; }
        const ans = s.answered;
        const opts = s._opts.map((o) => { let cls = 'opt-btn';
          if (ans) { const isCorrect = isChoose ? o === w.hu : o === w.ru; if (isCorrect) cls += ' correct'; else if (o === ans.choice) cls += ' wrong'; }
          const text = isChoose ? esc(o) : stressHtml(disp(BY_RU[o] || { ru: o }));
          return `<button class="${cls}" data-opt="${esc(o)}" ${ans ? 'disabled' : ''}>${text}</button>`; }).join('');
        body = `<div class="vcard">
          <div class="vhero"><div class="vhero-ov"></div><div class="vhero-top"><span class="vbadge phase-${phase}">${done}/2</span></div>
            <div class="vhero-center">${isChoose ? `<div class="vhero-word">${stressHtml(disp(w))}</div><div>${speakBtn(w.ru, 'vspeak')}</div>` : `<div class="vhero-prompt">${esc(w.hu)}</div>`}</div></div>
          <div class="vpanel"><div class="ex-q">${isChoose ? 'Mit jelent ez a szó?' : 'Melyik ez oroszul?'}</div>
            <div class="opt-grid">${opts}</div></div></div>`;
      }
      $app.innerHTML = chromeTop() + `<div class="study">${head}${body}</div>`;
      bindSubtabs();
      if (!s.group) bindStudyLevel();
      if (stage === 'flashcard') {
        $app.querySelectorAll('[data-flip]').forEach((el) => el.addEventListener('click', (e) => {
          if (e.target.closest('button')) return;
          const card = document.getElementById('flip'); const inner = card.querySelector('.flip3d-inner');
          inner.style.transform = 'scaleX(0)'; // collapse
          setTimeout(() => { s.flipped = !s.flipped; card.classList.toggle('is-flipped', s.flipped); inner.style.transform = 'scaleX(1)'; }, 150); // swap face + expand
        }));
        const kb = document.getElementById('know'); if (kb) kb.addEventListener('click', () => decide(false));
        const lb = document.getElementById('learn'); if (lb) lb.addEventListener('click', () => decide(true));
        armSwipe();
      } else {
        $app.querySelectorAll('[data-opt]').forEach((b) => b.addEventListener('click', () => answer(stage, b.dataset.opt, w)));
      }
    }

    // Optional grammar detail block (conjugation, past, government, grammar, nuance).
    const DET_FIELDS = [['ragozas', 'Ragozás (jelen idő)'], ['mult', 'Múlt idő'], ['vonzat', 'Vonzat'],
      ['nyelvtan', 'Nyelvtan'], ['arnyalat', 'Árnyalt jelentés']];
    function detHtml(d) {
      return `<div class="vdet">${DET_FIELDS.filter(([k]) => d[k]).map(([k, label]) =>
        `<h4>${label}</h4><p>${stressHtml(d[k])}</p>`).join('')}</div>`;
    }
    const DET = {}; // runtime cache of AI-fetched details, keyed by ru
    function openWord(w) {
      if (!w) return;
      const ov = document.createElement('div'); ov.className = 'peek-overlay';
      ov.innerHTML = `<div class="peek-card">
        <div class="peek-scroll">
          <div class="flash-word">${stressHtml(disp(w))} ${speakBtn(w.ru, 'speak-inline')}</div>
          ${w.pf ? `<div class="peek-pf"><b>bef.</b> ${stressHtml(w.pf)}</div>` : ''}
          <div class="flash-hu">${esc(w.hu)}</div>
          <div class="peek-pos">${esc(w.pos || '')} · ${esc(w.level)}</div>
          ${w.ex ? `<div class="vex">„${esc(w.ex)}"<span>${esc(w.exHu || '')}</span></div>` : ''}
          <div id="detbox" hidden></div>
        </div>
        <div class="peek-actions">
          <button class="btn ghost" id="pmore">✨ Tudj meg többet</button>
          <button class="btn" id="pstudy">📚 Tanuld ezt</button>
          <button class="btn ghost" id="pclose">Bezár</button>
        </div></div>`;
      ov.addEventListener('click', (e) => { if (e.target === ov || e.target.id === 'pclose') ov.remove(); });
      document.body.appendChild(ov);
      const box = ov.querySelector('#detbox');
      const pm = ov.querySelector('#pmore');
      let loaded = false;
      const preset = w.det || DET[w.ru];
      if (preset) { box.innerHTML = detHtml(preset); loaded = true; }

      const ps = ov.querySelector('#pstudy');
      ps.addEventListener('click', () => { ov.remove(); state.tab = 'learn'; buildStudy([w.ru]); });

      const hasServer = /^(localhost|127\.0\.0\.1|\[?::1\]?)$/.test(location.hostname);
      pm.addEventListener('click', async () => {
        if (loaded) { box.hidden = !box.hidden; pm.textContent = box.hidden ? '✨ Tudj meg többet' : '▲ Kevesebb'; return; }
        if (!hasServer) { box.hidden = false; box.innerHTML = '<div class="vdet"><p style="color:var(--sub)">A „Tudj meg többet" csak a helyi szerverrel megy (node server.js) — a weboldalon nem elérhető.</p></div>'; return; }
        pm.disabled = true; pm.textContent = '⏳ Töltés…'; box.hidden = false;
        box.innerHTML = '<div class="vdet"><p style="color:var(--sub)">Kérdezem az AI-t…</p></div>';
        try {
          const r = await fetch('/api/details', { method: 'POST', headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ ru: w.ru, stress: w.stress, pf: w.pf, hu: w.hu, pos: w.pos, level: w.level }) });
          if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || ('http_' + r.status)); }
          const det = await r.json();
          if (!det || !Object.keys(det).length) { box.innerHTML = '<div class="vdet"><p style="color:var(--sub)">Nincs több infó ehhez a szóhoz.</p></div>'; }
          else { DET[w.ru] = det; box.innerHTML = detHtml(det); }
          loaded = true; pm.disabled = false; pm.textContent = '▲ Kevesebb';
        } catch (e) {
          pm.disabled = false; pm.textContent = '✨ Tudj meg többet';
          const msg = e.message === 'no_key'
            ? 'Nincs OpenAI kulcs a szerveren. Állítsd be az OPENAI_API_KEY-t, és indítsd újra a szervert.'
            : 'Nem sikerült elérni az AI-t. Fut a szerver (server.js)? Van internet?';
          box.innerHTML = `<div class="vdet"><p style="color:#e5484d">${msg}</p></div>`;
        }
      });
    }

    // ---------- profile picker ("login") ----------
    function renderGate() {
      const profs = Object.entries(DB.profiles);
      const learned = (p) => Object.values(p.prog || {}).filter((x) => x.status === 'known').length;
      const cards = profs.map(([id, p]) => `<button class="prof-card" data-use="${id}">
        <span class="prof-av">${p.pin ? '🔒' : '👤'}</span>
        <span class="prof-main"><b>${esc(p.name)}</b><small>Szint: ${p.level === 'all' ? 'Mind' : esc(p.level)} · ${learned(p)} megtanult</small></span>
        <span class="prof-del" data-del="${id}" title="Törlés">🗑</span></button>`).join('');
      const lchip = (lv, l) => `<button class="lvl-chip ${state.newLevel === lv ? 'sel' : ''}" data-nl="${lv}"><b>${l}</b></button>`;
      const dialog = (state.pinFor && DB.profiles[state.pinFor]) ? `
        <div class="peek-overlay" id="pinov"><div class="peek-card" style="max-width:340px">
          <div class="flash-word" style="font-size:22px">🔒 ${esc(DB.profiles[state.pinFor].name)}</div>
          <p class="sub" style="margin:6px 0 12px">Add meg a PIN-kódot.</p>
          <input id="pinin" class="prof-input" inputmode="numeric" maxlength="8" placeholder="PIN" style="text-align:center;letter-spacing:.3em">
          ${state.pinErr ? '<p style="color:#e5484d;margin:8px 0 0">Hibás PIN.</p>' : ''}
          <div class="peek-actions"><button class="btn" id="pinok">Belépés</button><button class="btn ghost" id="pincancel">Mégse</button></div>
        </div></div>` : '';
      $app.innerHTML = `<div class="gate">
        <div class="page-head" style="text-align:center"><h1>🇷🇺 Ki tanul?</h1><p class="sub">Válassz egy profilt, vagy hozz létre újat. A profilt PIN-kód védi.</p></div>
        ${profs.length ? `<div class="prof-list">${cards}</div><div class="sec-h" style="text-align:center;font-size:15px">— vagy —</div>` : ''}
        <div class="prof-new card" style="padding:18px">
          <b>Új profil</b>
          <input id="pn" class="prof-input" placeholder="Név (pl. Szergej)" maxlength="24" value="${esc(state.newName)}" autocomplete="off">
          <div class="count" style="margin:10px 0 4px">Szint:</div>
          <div class="lvl-row" style="justify-content:flex-start">${lchip('all', 'Mind') + LEVELS.map((lv) => lchip(lv, lv)).join('')}</div>
          <div class="count" style="margin:10px 0 4px">PIN-kód (ezzel lépsz be más eszközön is):</div>
          <input id="ppin" class="prof-input" inputmode="numeric" maxlength="8" placeholder="pl. 1234" value="${esc(state.newPin)}" autocomplete="off">
          <button class="btn" id="pcreate" style="margin-top:14px;width:100%">Profil létrehozása</button>
        </div></div>${dialog}`;
      $app.querySelectorAll('[data-use]').forEach((b) => b.addEventListener('click', (e) => {
        if (e.target.closest('[data-del]')) return;
        const id = b.dataset.use; const p = DB.profiles[id];
        if (p.pin) { state.pinFor = id; state.pinErr = false; render(); }
        else { useProfile(id); state.tab = 'learn'; buildStudy(); }
      }));
      $app.querySelectorAll('[data-del]').forEach((b) => b.addEventListener('click', (e) => {
        e.stopPropagation(); const id = b.dataset.del;
        if (!confirm('Biztos törlöd ezt a profilt? A haladása elvész.')) return;
        delete DB.profiles[id]; if (DB.active === id) { DB.active = null; PROF = null; }
        saveDB(); syncPush(); render();
      }));
      const pn = $app.querySelector('#pn'); if (pn) pn.addEventListener('input', (e) => { state.newName = e.target.value; });
      const ppin = $app.querySelector('#ppin'); if (ppin) ppin.addEventListener('input', (e) => { state.newPin = e.target.value.replace(/\D/g, ''); });
      $app.querySelectorAll('[data-nl]').forEach((b) => b.addEventListener('click', () => { state.newLevel = b.dataset.nl; render(); }));
      const pc = $app.querySelector('#pcreate'); if (pc) pc.addEventListener('click', () => {
        const name = (state.newName || '').trim(); if (!name) { const el = $app.querySelector('#pn'); if (el) el.focus(); return; }
        const pin = (state.newPin || '').trim(); if (pin.length < 3) { alert('Adj meg legalább 3 számjegyű PIN-kódot.'); const el = $app.querySelector('#ppin'); if (el) el.focus(); return; }
        const id = newProfile(name, state.newLevel, pin); state.newName = ''; state.newLevel = 'all'; state.newPin = '';
        useProfile(id); state.tab = 'learn'; buildStudy();
      });
      const pinov = $app.querySelector('#pinov');
      if (pinov) {
        const din = $app.querySelector('#pinin'); if (din) din.focus();
        const submit = () => { const val = (($app.querySelector('#pinin') || {}).value || '').trim(); const p = DB.profiles[state.pinFor];
          if (p && hashPin(val) === p.pin) { const id = state.pinFor; state.pinFor = null; state.pinErr = false; useProfile(id); state.tab = 'learn'; buildStudy(); }
          else { state.pinErr = true; render(); } };
        const ok = $app.querySelector('#pinok'); if (ok) ok.addEventListener('click', submit);
        if (din) din.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
        const cancel = $app.querySelector('#pincancel'); if (cancel) cancel.addEventListener('click', () => { state.pinFor = null; state.pinErr = false; render(); });
        pinov.addEventListener('click', (e) => { if (e.target === pinov) { state.pinFor = null; render(); } });
      }
    }
    function render() {
      if (!PROF || state.gate) return renderGate();
      if (state.tab === 'words') renderWords();
      else if (state.tab === 'groups') renderGroups();
      else renderLearn();
    }

    // ---------- swipe on flashcard (decide) ----------
    let SW = null;
    function armSwipe() {
      const card = document.getElementById('flip'); if (!card) return;
      card.style.touchAction = 'pan-y';
      card.addEventListener('pointerdown', (e) => {
        if (e.target.closest('button')) return;
        const ind = document.createElement('div'); ind.className = 'swipe-ind';
        const ico = document.createElement('span'); ico.className = 'swipe-ico'; ind.appendChild(ico);
        const cap = document.createElement('span'); cap.className = 'swipe-cap'; ind.appendChild(cap);
        card.appendChild(ind); card.style.position = 'relative';
        SW = { card, ind, ico, cap, x0: e.clientX, dx: 0, moved: false };
      });
    }
    document.addEventListener('pointermove', (e) => {
      if (!SW) return; SW.dx = e.clientX - SW.x0; if (Math.abs(SW.dx) > 6) SW.moved = true;
      if (!SW.moved) return; const dir = SW.dx < 0 ? 'left' : 'right'; const rev = Math.min(1, Math.abs(SW.dx) / 90);
      SW.card.style.transform = `translateX(${SW.dx}px) rotate(${(SW.dx * 0.03).toFixed(2)}deg)`;
      SW.ind.style.opacity = 0.12 + rev * 0.8;
      const col = dir === 'left' ? '37,99,235' : '46,160,67';
      SW.ind.style.background = `linear-gradient(${dir === 'left' ? '90deg' : '270deg'}, rgba(${col},.9), rgba(${col},.12))`;
      SW.ico.textContent = dir === 'left' ? '👍' : '📚'; SW.cap.textContent = dir === 'left' ? 'Már tudom' : 'Tanulom';
    });
    function endSwipe() {
      if (!SW) return; const s = SW; SW = null;
      if (Math.abs(s.dx) >= 90) { const dir = s.dx < 0 ? 'left' : 'right';
        s.card.style.transition = 'transform .25s, opacity .25s'; s.card.style.transform = `translateX(${s.dx > 0 ? 600 : -600}px)`; s.card.style.opacity = '0';
        setTimeout(() => decide(dir === 'right'), 200);
      } else { s.card.style.transition = 'transform .2s'; s.card.style.transform = ''; if (s.ind) s.ind.remove(); }
    }
    document.addEventListener('pointerup', endSwipe);
    document.addEventListener('pointercancel', endSwipe);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { const ov = document.querySelector('.peek-overlay'); if (ov) ov.remove(); } });

    // ---------- boot ----------
    if (PROF) buildStudy(); // prepares a session for the active profile
    render();
    syncPull(); // pull cloud profiles if sync is configured (no-op otherwise)
  </script>
</body>
</html>
